name: Create Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          zip -r vod2strm-${{ github.ref_name }}.zip . \
            -x ".git/*" ".gitignore" ".github/*" "__pycache__/*" "*.pyc" ".DS_Store"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vod2strm-${{ github.ref_name }}
          path: vod2strm-${{ github.ref_name }}.zip

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: vod2strm-${{ github.ref_name }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generateReleaseNotes: true
